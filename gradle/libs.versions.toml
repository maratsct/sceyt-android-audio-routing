[versions]
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
kotlin = "2.3.0"
composeBom = "2026.02.00"
coroutines = "1.10.2"
mockito = "5.21.0"
mockitoKotlin = "6.2.3"
mockitoAndroid = "5.21.0"
testRunner = "1.7.0"
